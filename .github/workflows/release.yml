name: Create Release
on:
  push:
    branches:
      - "release/**"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          if ! echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$'; then
            echo "Refusing release: '$TAG' is not a version like 2.0.1 or 1.0.12b50" >&2
            exit 1
          fi
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES_FLAG="--notes-file RELEASE_NOTES.md"
          else
            NOTES_FLAG="--generate-notes"
          fi
          if echo "$TAG" | grep -qE 'b[0-9]+'; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            $NOTES_FLAG \
            $PRERELEASE_FLAG
      - name: Delete trigger branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${GITHUB_REF_NAME}" || true
