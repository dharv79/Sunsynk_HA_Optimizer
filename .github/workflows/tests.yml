name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install test tools (pinned)
        run: pip install pytest==9.2.0 pyflakes==4.1.0 bandit==1.9.4
      - name: Compile check
        run: python -m py_compile custom_components/sunsynk_optimizer/*.py
      - name: Lint (undefined names, unused imports)
        run: python -m pyflakes custom_components/sunsynk_optimizer/*.py
      - name: Run tests
        run: python -m pytest
      - name: Security scan (bandit, medium and high)
        run: python -m bandit -q -r custom_components tools -ll
